name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install environment and hooks
        run: make setup
      - name: Check lint, formatting and types
        run: make check
      - name: Check commit hooks
        run: make hooks
      - name: Run demo
        run: make demo
      - name: Unit tests
        run: make test
      - name: Start RustFS and initialize bucket
        run: make s3-up
      - name: Real S3 immutability and round-trip tests
        run: make test-s3
      - name: Build trainer and start MLflow
        run: make infra-up
      - name: Prepare tiny isolated training fixture
        run: sh scripts/uv.sh run --extra train --no-sync python scripts/prepare_training_smoke.py
      - name: Train two epochs in a real container
        run: make train CONFIG=.tools/ci-smoke.json
      - name: Verify real MLflow and model artifacts
        run: sh scripts/uv.sh run --extra train --no-sync python scripts/check_training_smoke.py
      - name: Stop containers
        if: always()
        run: docker compose --profile training down
