services:
  s3-permissions:
    image: busybox:1.37.0
    user: "0:0"
    volumes:
      - s3-data:/data
      - s3-logs:/logs
    command: ["sh", "-c", "chown 10001:10001 /data /logs"]
    restart: "no"

  s3:
    image: rustfs/rustfs:1.0.4
    depends_on:
      s3-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Run make setup first}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Run make setup first}
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:?Run make setup first}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:?Run make setup first}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "${S3_BIND_HOST:?}:${S3_API_PORT:?}:9000"
      - "${S3_BIND_HOST:?}:${S3_CONSOLE_PORT:?}:9001"
    volumes:
      - s3-data:/data
      - s3-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "${S3_HEALTHCHECK_URL:?}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  s3-init:
    build:
      context: .
      dockerfile: docker/data.Dockerfile
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:?}
    restart: "no"

  mlflow-init:
    build:
      context: .
      dockerfile: docker/data.Dockerfile
    entrypoint: ["/app/.venv/bin/python", "-m", "ml_product_infrastructure.experiments.init_store"]
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:?}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:?Run make setup first}
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    depends_on:
      mlflow-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:?}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: ${S3_REGION:?}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS:?}
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--serve-artifacts", "--artifacts-destination", "s3://${MLFLOW_BUCKET:?}/"]
    volumes:
      - mlflow-db:/mlflow
    ports:
      - "${MLFLOW_BIND_HOST:?}:${MLFLOW_PORT:?}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  trainer:
    profiles: [training]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${TRAINING_GIT_COMMIT:-}
    depends_on:
      s3:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_INTERNAL_ENDPOINT_URL:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:?}
      MLFLOW_TRACKING_URI: ${MLFLOW_INTERNAL_TRACKING_URI:?}
      TRAIN_CACHE_DIR: /cache
      TRAIN_OUTPUT_DIR: /runs
    volumes:
      - train-cache:/cache
      - train-runs:/runs
      - .:/workspace:ro
    init: true
    restart: "no"

volumes:
  s3-data:
  s3-logs:
  mlflow-db:
  train-cache:
  train-runs:
